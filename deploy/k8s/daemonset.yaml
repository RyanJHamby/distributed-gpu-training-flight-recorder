apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-flight-recorder
  namespace: gpu-monitoring
  labels:
    app: gpu-flight-recorder
    component: agent
spec:
  selector:
    matchLabels:
      app: gpu-flight-recorder
      component: agent
  template:
    metadata:
      labels:
        app: gpu-flight-recorder
        component: agent
    spec:
      # Run on GPU nodes only
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: gfr-agent
          image: gpu-flight-recorder:latest
          args:
            - agent
            - --coordinator
            - gfr-coordinator.gpu-monitoring.svc.cluster.local:50051
            - --node-id
            - $(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            privileged: true  # Required for DCGM/NVML access
          volumeMounts:
            - name: nvidia-driver
              mountPath: /usr/local/nvidia
              readOnly: true
      volumes:
        - name: nvidia-driver
          hostPath:
            path: /usr/local/nvidia
