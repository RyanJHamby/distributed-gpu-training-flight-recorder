# Agent: tails the JSONL files that the Python shim writes on each node
# (shim/gfr_torch.py Recorder(out_dir="/var/run/gfr")) and streams them to the
# coordinator. It needs no GPU access and no privileges: NVML is read by the
# shim inside the training pod.
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: gpu-flight-recorder, namespace: gpu-monitoring, labels: {app: gpu-flight-recorder}}
spec:
  selector: {matchLabels: {app: gpu-flight-recorder}}
  template:
    metadata: {labels: {app: gpu-flight-recorder}}
    spec:
      nodeSelector: {nvidia.com/gpu.present: "true"}
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      containers:
        - name: gfr-agent
          image: gpu-flight-recorder:latest
          args: ["agent", "--coordinator", "gfr-coordinator.gpu-monitoring.svc.cluster.local:50051",
                 "--node-id", "$(NODE_NAME)", "--tail", "/var/run/gfr/rank*.jsonl"]
          env: [{name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: gfr, mountPath: /var/run/gfr, readOnly: true}]
      volumes: [{name: gfr, hostPath: {path: /var/run/gfr, type: DirectoryOrCreate}}]
