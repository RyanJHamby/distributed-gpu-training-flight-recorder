# Local demo: one coordinator and eight agents, each replaying one rank of a
# recorded run. Query from the host:  gfr report --coordinator localhost:50051
# Verified: builds, 8 agents exit 0, coordinator reports rank 2 / thermal_throttle.
x-agent: &agent
  build: {context: .., dockerfile: deploy/Dockerfile}
  volumes: ["../examples/traces:/traces:ro"]
  depends_on: [coordinator]
  restart: "no"

services:
  coordinator:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["coordinator", "--listen", ":50051"]
    ports: ["50051:50051"]
  agent-0:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "0"]
  agent-1:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "1"]
  agent-2:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "2"]
  agent-3:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "3"]
  agent-4:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "4"]
  agent-5:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "5"]
  agent-6:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "6"]
  agent-7:
    <<: *agent
    command: ["agent", "--coordinator", "coordinator:50051", "--replay", "/traces/thermal.jsonl", "--ranks", "7"]
