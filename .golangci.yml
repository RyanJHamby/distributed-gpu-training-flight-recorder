run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gocritic
    - revive
    - misspell

linters-settings:
  govet:
    enable-all: true
  revive:
    rules:
      - name: blank-imports
      - name: exported
      - name: unreachable-code
      - name: unused-parameter

issues:
  exclude-rules:
    # Allow TODO comments
    - linters:
        - godox
      text: "TODO"
    # Test files can have unused parameters
    - path: _test\.go
      linters:
        - unused
        - revive
